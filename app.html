<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05080d" />
    <meta name="description" content="智学节律学习空间：目标、周计划、今日执行与周报复盘。" />
    <title>智学节律 · 学习空间</title>
    <script>
      // 首屏前恢复主题，避免深色站出现白闪
      (function () {
        try {
          var t = localStorage.getItem('zhixue-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#05080d' : '#f5f8f9');
          document.documentElement.style.background = t === 'dark' ? '#05080d' : '#f5f8f9';
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { margin: 0; background: #05080d; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f5f8f9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
